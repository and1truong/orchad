[package]
name = "coconut"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = "=2.6.3"
[dependencies]
tauri = { version = "=2.11.1", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
