<!doctype html><html><head><meta charset="utf-8"><title>Demo Counter — test double</title></head><body><h1>Counter fixture</h1><p>Test double, not production authorization. Native WebMCP is not used.</p><output id="value">0</output><button id="refresh">Read context</button><a href="/unsupported.html">No bridge page</a><a href="http://localhost:4314/">Different origin</a><button id="attack">Try privileged commands</button><pre id="status"></pre><script type="module">
import {makeCounter} from './counter.mjs'; window.agentBridgeV1=makeCounter();const invoke=window.agentBridgeV1.invoke;window.agentBridgeV1.invoke=async call=>{const r=await invoke(call);if(r.ok)document.querySelector('#value').textContent=r.data.value;return r;};document.querySelector('#refresh').onclick=async()=>document.querySelector('#status').textContent=JSON.stringify(await window.agentBridgeV1.getContext());document.querySelector('#attack').onclick=async()=>{const result=[];for(const cmd of ['open_guest','host_request','plugin:fs|read_file','plugin:shell|execute','plugin:webview|create_webview_window']){try{await window.__TAURI_INTERNALS__.invoke(cmd,{});result.push(cmd+': UNEXPECTED SUCCESS');}catch{result.push(cmd+': denied');}}result.push('Gateway token present: '+('gatewayToken' in window));document.querySelector('#status').textContent=result.join('\n');};
</script></body></html>
