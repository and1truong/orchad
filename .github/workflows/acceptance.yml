name: acceptance
on:
  pull_request:
  push:
    branches: [main]
jobs:
  contract-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CONTRACT.md stays byte-identical to the root contract
        run: |
          for poc in lime coconut guava mango pear; do cmp contract "$poc/CONTRACT.md"; done
  agent-durable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: packages/agent-durable/package-lock.json }
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: mango
        run: npm ci
      - name: Pear and Lime dependencies for actual durable domain recovery
        working-directory: pear
        run: npm ci
      - working-directory: lime
        run: npm ci
      - working-directory: packages/agent-durable
        run: |
          npm ci
          npm run check
          npm run build
          npm test
  lime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: lime/package-lock.json }
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: mango
        run: npm ci
      - working-directory: lime
        run: |
          npm ci
          npm run build
          npm test
  coconut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: coconut/package-lock.json }
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: mango
        run: npm ci
      - working-directory: coconut
        run: |
          npm ci
          npm run package:sidecar
          npm test
          npm run build
  coconut-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: coconut/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: mango
        run: npm ci
      - working-directory: coconut
        run: |
          npm ci
          npm run package:sidecar
          npm run build
      - name: Build the real Pear guest for native integration
        working-directory: pear
        run: |
          npm ci
          npm run build
      - working-directory: coconut/src-tauri
        run: cargo build --verbose
      - name: Rust predicate unit tests
        working-directory: coconut/src-tauri
        run: cargo test
      # Lane: native-runtime. Drives the real Tauri binary under xvfb through
      # the COCONUT_SMOKE=1 debug control channel — ready/binding markers,
      # heartbeat lease, consent, approval-gated mutation, hidden-UI denial,
      # rebind revocation. Any failure exits non-zero and fails this lane;
      # there is no `--version` shortcut and no `|| true`.
      - name: Native runtime acceptance lane
        working-directory: coconut
        run: |
          BIN=$(find src-tauri/target/debug -maxdepth 1 -type f -executable -name 'coconut*' | head -1)
          test -n "$BIN"
          npm run dev >/tmp/coconut-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:1420/ >/dev/null && break; sleep 1; done
          xvfb-run -a node scripts/native-acceptance.mjs "$BIN"
      - name: Native Pear WebView and external Coconut MCP acceptance
        working-directory: coconut
        run: |
          BIN=$(find src-tauri/target/debug -maxdepth 1 -type f -executable -name 'coconut*' | head -1)
          test -n "$BIN"
          xvfb-run -a node scripts/native-pear-acceptance.mjs "$BIN"
  guava:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: guava/package-lock.json }
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: guava
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - working-directory: coconut
        run: npm ci
      - name: Strict integration — real guava service behind real coconut MCP host
        working-directory: guava
        run: |
          node --import tsx scripts/host-fixture.ts > /tmp/host-env.sh &
          for i in $(seq 1 30); do grep -q ORCHARD_DESKTOP_MCP_TOKEN /tmp/host-env.sh && break; sleep 1; done
          source /tmp/host-env.sh
          ORCHARD_RUN_WRITES=true \
          ORCHARD_INTEGRATION_REQUIRE=DESKTOP \
          node --import tsx scripts/integration.ts --strict
  mango:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: mango/package-lock.json }
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: mango
        run: |
          npm ci
          npm run build
          npm test
  pear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: pear/package-lock.json }
      - name: PDF certificate text verification dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: pear
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
          PEAR_E2E_PRODUCTION=1 npm run test:e2e
      - working-directory: mango
        run: npm ci
      - working-directory: lime
        run: |
          npm ci
          npm run build
      - working-directory: pear
        run: |
          npm run typecheck:host
          npm run test:host
          PEAR_E2E_PRODUCTION=1 npm run test:browser-host
          npm run test:lime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pear-browser-evidence
          path: |
            pear/artifacts/
            pear/test-results/
