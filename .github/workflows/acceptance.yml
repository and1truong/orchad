name: acceptance
on:
  pull_request:
  push:
    branches: [main]
jobs:
  contract-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CONTRACT.md stays byte-identical to the root contract
        run: |
          for poc in lime coconut guava mango pear; do cmp contract "$poc/CONTRACT.md"; done
  agent-durable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: packages/agent-durable/package-lock.json }
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: mango
        run: npm ci
      - name: Pear and Lime dependencies for actual durable domain recovery
        working-directory: pear
        run: npm ci
      - working-directory: lime
        run: npm ci
      - working-directory: packages/agent-durable
        run: |
          npm ci
          npm run check
          npm run build
          npm test
  lime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: lime/package-lock.json }
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: mango
        run: npm ci
      - working-directory: lime
        run: |
          npm ci
          npm run build
          npm test
  coconut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: coconut/package-lock.json }
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: mango
        run: npm ci
      - working-directory: coconut
        run: |
          npm ci
          npm run package:sidecar
          npm test
          npm run build
  coconut-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: coconut/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: mango
        run: npm ci
      - working-directory: coconut
        run: |
          npm ci
          npm run package:sidecar
          npm run build
      - name: Build the real Pear guest for native integration
        working-directory: pear
        run: |
          npm ci
          npm run build
      - working-directory: coconut/src-tauri
        run: cargo build --verbose
      - name: Rust predicate unit tests
        working-directory: coconut/src-tauri
        run: cargo test
      - name: Actual native runtime, Pear and all four SCORM profiles
        working-directory: coconut
        run: xvfb-run -a node scripts/native-platform-acceptance.mjs src-tauri/target/debug/coconut
  coconut-native-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: coconut/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: mango
        run: npm ci
      - working-directory: coconut
        run: |
          npm ci
          npm run package:sidecar
          npm run build
      - working-directory: pear
        run: |
          npm ci
          npm run build
          node --import tsx --test --test-isolation=none tests/native-fixture-lifecycle.test.ts
      - working-directory: coconut/src-tauri
        run: |
          cargo build --verbose
          cargo test
      - name: Actual WebView2/WKWebView runtime and four-edition SCORM acceptance
        working-directory: coconut
        run: |
          BIN=src-tauri/target/debug/coconut
          if [ "${{ runner.os }}" = Windows ]; then BIN="$BIN.exe"; fi
          set -o pipefail
          node scripts/native-platform-acceptance.mjs "$BIN" 2>&1 | tee native-platform.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: native-platform-${{ runner.os }}
          path: coconut/native-platform.log
  guava:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: guava/package-lock.json }
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: guava
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - working-directory: coconut
        run: npm ci
      - name: Strict integration — real guava service behind real coconut MCP host
        working-directory: guava
        run: |
          node --import tsx scripts/host-fixture.ts > /tmp/host-env.sh &
          for i in $(seq 1 30); do grep -q ORCHARD_DESKTOP_MCP_TOKEN /tmp/host-env.sh && break; sleep 1; done
          source /tmp/host-env.sh
          ORCHARD_RUN_WRITES=true \
          ORCHARD_INTEGRATION_REQUIRE=DESKTOP \
          node --import tsx scripts/integration.ts --strict
  mango:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: mango/package-lock.json }
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: mango
        run: |
          npm ci
          npm run build
          npm test
  pear:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: pear/package-lock.json }
      - name: PDF certificate text verification dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - working-directory: packages/bridge-contract
        run: npm ci
      - working-directory: pear
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
          PEAR_E2E_PRODUCTION=1 npm run test:e2e
      - working-directory: mango
        run: npm ci
      - working-directory: lime
        run: |
          npm ci
          npm run build
      - working-directory: pear
        run: |
          npm run typecheck:host
          npm run test:host
          PEAR_E2E_PRODUCTION=1 npm run test:browser-host
          npm run test:lime
          npm run test:scorm:lime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: pear-browser-evidence
          path: |
            pear/artifacts/
            pear/test-results/
